name: 1999.co.jp Watcher Relay G2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '12 */6 * * *'

concurrency:
  group: watcher-1999-g2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Run watcher (group 2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_BUDGET_SECONDS: "20400"
          CHECK_INTERVAL_SECONDS: "40"
          PRODUCTS_FILE: "products-1999-g2.json"
          STATE_FILE: "watcher_state_1999_g2.json"
          START_OFFSET_SECONDS: "15"
        run: python watcher_1999.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "watcher-1999-g2-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain watcher_state_1999_g2.json)" ]; then
            git add watcher_state_1999_g2.json
            git commit -m "chore: update 1999.co.jp g2 state [skip ci]"
            git push
          fi

      - name: Trigger next relay run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watcher-1999-g2.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
