name: Amazon Watcher Relay 2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '3 */6 * * *'   # 跟第一組的安全網錯開幾分鐘,不要同時觸發

concurrency:
  group: amazon-watcher-2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher (bounded loop, group 2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_BUDGET_SECONDS: "20400"
          CHECK_INTERVAL_SECONDS: "60"
          PRODUCTS_FILE: "products-2.json"
          STATE_FILE: "watcher_state-2.json"
          START_OFFSET_SECONDS: "30"   # 跟第一組錯開半個週期,避免同一秒發請求
        run: python amazon_watcher.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "amazon-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain watcher_state-2.json)" ]; then
            git add watcher_state-2.json
            git commit -m "chore: update watcher-2 state [skip ci]"
            git push
          else
            echo "狀態檔沒有變化,不需要 commit"
          fi

      - name: Trigger next relay run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/amazon-watcher-2.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
