name: MM Toyshop Watcher Relay

on:
  workflow_dispatch: {}
  schedule:
    - cron: '6 */6 * * *'   # 安全網,跟其他組再錯開幾分鐘

concurrency:
  group: mm-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-mm.txt
          playwright install --with-deps chromium

      - name: Run MM watcher (bounded loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_BUDGET_SECONDS: "20400"
          CHECK_INTERVAL_SECONDS: "30"
        run: python mm_watcher.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "mm-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain mm_watcher_state.json)" ]; then
            git add mm_watcher_state.json
            git commit -m "chore: update mm watcher state [skip ci]"
            git push
          else
            echo "狀態檔沒有變化,不需要 commit"
          fi

      - name: Trigger next relay run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mm-watcher.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
