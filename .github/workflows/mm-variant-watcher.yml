name: MM Toyshop Variant Watcher Relay

on:
  workflow_dispatch: {}
  schedule:
    # 每天台灣時間 11:30 啟動(轉換成 UTC = 03:30)
    - cron: '30 3 * * *'
    # 安全網:防止接力鏈中途斷掉,時段內每 4 小時再檢查一次要不要重新接上
    - cron: '30 7,11 * * *'    # UTC 07:30, 11:30 = 台灣 15:30, 19:30

concurrency:
  group: mm-variant-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run MM variant watcher (bounded loop, time-windowed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_BUDGET_SECONDS: "20400"
          CHECK_INTERVAL_SECONDS: "10"
        run: python mm_variant_watcher.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "mm-variant-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain mm_variant_state.json)" ]; then
            git add mm_variant_state.json
            git commit -m "chore: update mm variant watcher state [skip ci]"
            git push
          fi

      - name: Trigger next relay run (only if still within 11:30~02:30 window)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
        run: |
          now_hm=$(TZ=Asia/Taipei date +%H%M)
          now_num=$((10#$now_hm))
          if [ "$now_num" -ge 1130 ] || [ "$now_num" -le 230 ]; then
            echo "仍在監控時段內($now_hm),接力觸發下一次執行"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mm-variant-watcher.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"
          else
            echo "已超出監控時段($now_hm),不再接力,明天 11:30 由排程自動重新啟動"
          fi
