name: Amazon Watcher Relay

on:
  workflow_dispatch: {}   # 第一次要手動按這個啟動接力鏈
  schedule:
    - cron: '0 */6 * * *' # 安全網:每 6 小時觸發一次,避免接力鏈斷掉後永遠沒人接手

# 確保同時間只有一個在跑,不會因為安全網 cron 跟接力觸發重疊而開兩個
concurrency:
  group: amazon-watcher
  cancel-in-progress: false

permissions:
  contents: write   # 需要能把 watcher_state.json commit 回 repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 留一點緩衝在 GitHub 6 小時(360 分)硬上限之前
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher (bounded loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_BUDGET_SECONDS: "20400"   # 5h40m,可自行調整
          CHECK_INTERVAL_SECONDS: "60"
        run: python amazon_watcher.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "amazon-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain watcher_state.json)" ]; then
            git add watcher_state.json
            git commit -m "chore: update watcher state [skip ci]"
            git push
          else
            echo "狀態檔沒有變化,不需要 commit"
          fi

      - name: Trigger next relay run
        if: always()
        env:
          # 這裡故意不用預設 GITHUB_TOKEN,因為它被 GitHub 限制不能觸發新的 workflow run
          # 必須用你自己建立的 Personal Access Token(存成 secret RELAY_PAT)
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/amazon-watcher.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
